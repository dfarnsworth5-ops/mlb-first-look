<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB DFS First Look — Data Shell</title>
<style>
  :root {
    --navy: #1a2744;
    --red: #c8102e;
    --bg: #fafafa;
    --border: #e2e2e2;
    --row-alt: #f4f4f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: #1a1a1a;
  }
  .shell {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
  }
  .header {
    background: var(--navy);
    color: #fff;
    padding: 14px 20px;
    border-radius: 8px 8px 0 0;
    border-bottom: 3px solid var(--red);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 14px;
    flex-wrap: wrap;
  }
  .tabs {
    display: flex;
    gap: 6px;
  }
  .tab-btn {
    padding: 7px 16px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  #search {
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    width: 220px;
  }
  .table-wrap {
    background: #fff;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: auto;
    max-height: 620px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    white-space: nowrap;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #eceef2;
    z-index: 2;
    padding: 8px 10px;
    text-align: center;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    font-weight: 600;
    color: #333;
  }
  thead th:first-child {
    text-align: left;
    position: sticky;
    left: 0;
    z-index: 3;
  }
  thead th .arrow {
    font-size: 10px;
    color: var(--red);
    margin-left: 3px;
  }
  tbody td {
    padding: 8px 10px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  tbody td:first-child {
    text-align: left;
    font-weight: 600;
    position: sticky;
    left: 0;
    background: inherit;
    z-index: 1;
  }
  tbody tr:nth-child(even) td:first-child { background: var(--row-alt); }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover td { filter: brightness(0.97); }
  .note {
    font-size: 12px;
    color: #777;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="shell">
  <div class="header">🏈 MLB DFS FIRST LOOK</div>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" data-tab="pitchers">Pitcher Breakdown</button>
      <button class="tab-btn" data-tab="hitters">Hitter Breakdown</button>
    </div>
    <input id="search" type="text" placeholder="Search name or team...">
  </div>
  <div class="table-wrap">
    <table id="dataTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
  <p class="note">Data loads from <code>data.json</code> in this same folder. Update that file to refresh the table — no HTML edits needed.</p>
</div>

<script>
// ---- Column definitions per tab: key, label, and (for stats) the paired percentile key that drives color ----
const COLUMNS = {
  pitchers: [
    { key: "name", label: "Pitcher — Name" },
    { key: "team", label: "Team" },
    { key: "hand", label: "Hand" },
    { key: "opponent", label: "Opponent" },
    { key: "line", label: "Line" },
    { key: "otot", label: "OTOT", pct: "otot_pct" },
    { key: "dk", label: "DK", fmt: "money" },
    { key: "fd", label: "FD", fmt: "money" },
    { key: "starts", label: "Starts" },
    { key: "xwoba", label: "xwOBA", pct: "xwoba_pct" },
    { key: "xera", label: "xERA", pct: "xera_pct" },
    { key: "siera", label: "SIERA", pct: "siera_pct" },
    { key: "era", label: "ERA", pct: "era_pct" },
    { key: "k", label: "K%", fmt: "pct" },
    { key: "bb", label: "BB%", fmt: "pct", pct: "bb_pct" },
    { key: "ss", label: "SS%", fmt: "pct", pct: "ss_pct" },
    { key: "gb", label: "GB%", fmt: "pct", pct: "gb_pct" },
    { key: "time", label: "Time (ET)" }
  ],
  hitters: [
    { key: "name", label: "Batter — Name" },
    { key: "team", label: "Team" },
    { key: "hand", label: "Hand" },
    { key: "order", label: "Order" },
    { key: "total", label: "Total", pct: "total_pct" },
    { key: "woba", label: "wOBA", pct: "woba_pct" },
    { key: "iso", label: "ISO", pct: "iso_pct" },
    { key: "xwoba", label: "xwOBA", pct: "xwoba_pct" },
    { key: "dk", label: "DK", fmt: "money" },
    { key: "pos", label: "Pos" },
    { key: "matchup", label: "Matchup" },
    { key: "time", label: "Time (ET)" }
  ]
};

// Fix: give xERA/SIERA/ERA/K% correct pct keys (they were missing above for pitchers except xwoba)
COLUMNS.pitchers.find(c => c.key === "xera").pct = "xera_pct";
COLUMNS.pitchers.find(c => c.key === "siera").pct = "siera_pct";
COLUMNS.pitchers.find(c => c.key === "era").pct = "era_pct";
COLUMNS.pitchers.find(c => c.key === "k").pct = "k_pct";

let DATA = { pitchers: [], hitters: [] };
let activeTab = "pitchers";
let sortKey = null;
let sortDir = 1;

// ---- 7-stop blue/orange gradient, same math as the spreadsheet formulas ----
const STOPS = [
  [0,     178, 24,  43],
  [1/6,   239, 138, 98],
  [2/6,   253, 219, 199],
  [3/6,   247, 247, 247],
  [4/6,   209, 229, 240],
  [5/6,   103, 169, 207],
  [1,     33,  102, 172]
];
function gradientColor(p) {
  if (p == null || isNaN(p)) return null;
  p = Math.max(0, Math.min(1, p));
  for (let i = 0; i < STOPS.length - 1; i++) {
    const [p0, r0, g0, b0] = STOPS[i];
    const [p1, r1, g1, b1] = STOPS[i + 1];
    if (p >= p0 && p <= p1) {
      const t = (p1 === p0) ? 0 : (p - p0) / (p1 - p0);
      const r = Math.round(r0 + t * (r1 - r0));
      const g = Math.round(g0 + t * (g1 - g0));
      const b = Math.round(b0 + t * (b1 - b0));
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      return { bg: `rgb(${r},${g},${b})`, text: lum > 150 ? "#000" : "#fff" };
    }
  }
  return null;
}

function fmt(val, type) {
  if (val === null || val === undefined) return "";
  if (type === "money") return "$" + Number(val).toLocaleString();
  if (type === "pct") return val + "%";
  return val;
}

function render() {
  const cols = COLUMNS[activeTab];
  const headRow = document.getElementById("headRow");
  headRow.innerHTML = "";
  cols.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label;
    if (sortKey === col.key) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = sortDir === 1 ? "▲" : "▼";
      th.appendChild(arrow);
    }
    th.addEventListener("click", () => {
      if (sortKey === col.key) sortDir *= -1; else { sortKey = col.key; sortDir = 1; }
      render();
    });
    headRow.appendChild(th);
  });

  let rows = DATA[activeTab].slice();
  const q = document.getElementById("search").value.trim().toLowerCase();
  if (q) rows = rows.filter(r => (r.name || "").toLowerCase().includes(q) || (r.team || "").toLowerCase().includes(q));

  if (sortKey) {
    rows.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (av === null || av === undefined) av = -Infinity;
      if (bv === null || bv === undefined) bv = -Infinity;
      if (typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av - bv) * sortDir;
    });
  }

  const tbody = document.getElementById("bodyRows");
  tbody.innerHTML = "";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    cols.forEach(col => {
      const td = document.createElement("td");
      td.textContent = fmt(row[col.key], col.fmt);
      if (col.pct && row[col.pct] != null) {
        const c = gradientColor(row[col.pct]);
        if (c) { td.style.background = c.bg; td.style.color = c.text; }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    sortKey = null;
    render();
  });
});
document.getElementById("search").addEventListener("input", render);

fetch("data.json")
  .then(r => r.json())
  .then(json => { DATA = json; render(); })
  .catch(err => {
    document.getElementById("bodyRows").innerHTML =
      '<tr><td colspan="20" style="padding:20px;text-align:center;color:#999;">Could not load data.json — if opening this file directly (file://), it needs to be served over http(s), e.g. via GitHub Pages.</td></tr>';
    console.error(err);
  });
</script>

</body>
</html>
